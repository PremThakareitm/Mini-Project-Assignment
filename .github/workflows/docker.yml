name: StartupFund AI Docker Hub CD Workflow

on:
  push:
    branches: [ main ]

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/startupfund-ai:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/startupfund-ai:${{ github.sha }}

      - name: Skip Docker Build (No Credentials)
        if: secrets.DOCKERHUB_USERNAME == '' || secrets.DOCKERHUB_TOKEN == ''
        run: |
          echo "⚠️ Docker Hub credentials not configured. Skipping Docker build and push."
          echo "To enable Docker builds, add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets in GitHub repository settings."
